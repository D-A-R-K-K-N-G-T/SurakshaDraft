# Public edge for the EC2 deployment.
#
# Differs from the dev nginx.conf in two ways that matter:
#
#  1. Upstreams are compose service names, not host.docker.internal — every
#     service runs in this network, nothing runs on the host.
#  2. EVERYTHING goes to the gateway. The dev config forwards /api/ to the
#     Python service, but the gateway owns /api/* (/api/preview, /api/claims,
#     /api/personal/submit, ...) while FastAPI owns the disjoint /api/v1/*.
#     Forwarding /api/ to FastAPI here would 404 every request the mobile app
#     makes. The pipeline is reachable only from the gateway, over the compose
#     network — it is deliberately not exposed to the internet, because the
#     gateway is what hashes, encrypts, and stores uploads before handing off.

upstream gateway {
    server gateway:3000;
}

server {
    listen 80;
    server_name _;

    # Claim submissions carry several photos; nginx's 1m default rejects them
    # with a 413 long before multer sees the request.
    client_max_body_size 25m;

    # Vision preview and claim submit both block on an LLM round trip. The 60s
    # proxy default surfaces as a 504 mid-claim.
    proxy_connect_timeout 15s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Cheap unauthenticated liveness probe — does not wake the app containers.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream uploads through instead of buffering the whole body to disk
        # first — the root volume is small and this avoids a pointless copy.
        proxy_request_buffering off;
    }
}

# Alembic configuration for SurakshaDraft.
#
# The database URL is NOT set here — env.py reads it from
# agentic_pipeline.config.settings.database_url (one source of truth, driven by
# DATABASE_URL in the environment / .env). Run from the repo root:
#
#   alembic upgrade head
#   alembic downgrade base
#   alembic revision -m "add foo"      # then hand-review the generated file
#   alembic check                      # fail on un-migrated model drift
[alembic]
script_location = agentic_pipeline/migrations
# Timezone-aware, sortable revision filenames: 2026_08_09_1430-<rev>_<slug>.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-agentic-pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: suraksha
          POSTGRES_PASSWORD: suraksha
          POSTGRES_DB: suraksha
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./agentic_pipeline
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Schema Migrations
      working-directory: ./agentic_pipeline
      env:
        DATABASE_URL: postgresql+psycopg://suraksha:suraksha@localhost:5432/suraksha
      run: alembic upgrade head

    - name: Run Tests (with Ephemeral Postgres)
      working-directory: ./agentic_pipeline
      env:
        DATABASE_URL: postgresql+psycopg://suraksha:suraksha@localhost:5432/suraksha
        TEST_POSTGRES_URL: postgresql+psycopg://suraksha:suraksha@localhost:5432/suraksha
      run: pytest -v

# Builds the release APK on GitHub's runners, which already carry the Android
# SDK and accepted licenses — so no local Flutter/Android toolchain is needed.
#
# Run it from the Actions tab: "Build APK" -> "Run workflow", and supply the
# backend's public address. API_BASE is compiled in (mobile_app/lib/config.dart
# reads it via String.fromEnvironment), so a new server IP means a new build.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Backend base URL, no trailing slash (nginx listens on 80, so no port suffix)"
        required: true
        default: "http://13.233.105.68"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # android/app/build.gradle.kts pins sourceCompatibility/jvmTarget to 17;
      # a newer JDK makes Gradle fail on an unsupported class file version.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # pubspec.yaml requires Dart sdk ^3.11.5, so track stable rather than
      # pinning a version that may fall below that floor.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: mobile_app
        run: flutter pub get

      # ndkVersion 28.2.13676358 is pinned in build.gradle.kts and is usually
      # not preinstalled; this makes the download an explicit, readable step
      # rather than a mysterious pause inside the Gradle build.
      - name: Install pinned NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      # android/app/build.gradle.kts wires buildTypes.release to a "release"
      # signingConfig whose storeFile defaults to a keystore.jks that is not in
      # the repo (correctly — signing keys do not belong in git). Without this
      # step Gradle fails with "Keystore file not found for signing config".
      #
      # This key is generated fresh per run and thrown away, which is fine for a
      # demo build but means each APK is signed by a DIFFERENT key: Android will
      # refuse to install one over another, so uninstall the old app first. For
      # anything real, generate a keystore once and store it in repo secrets.
      - name: Generate a throwaway signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/demo.jks" \
            -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -alias demo \
            -dname "CN=SurakshaDraft Demo, OU=Demo, O=Demo, L=NA, ST=NA, C=IN" \
            -storepass demo1234 -keypass demo1234
          echo "KEYSTORE_PATH=$RUNNER_TEMP/demo.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=demo1234" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=demo" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=demo1234" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: mobile_app
        run: flutter build apk --release --dart-define=API_BASE=${{ inputs.api_base }}

      - uses: actions/upload-artifact@v4
        with:
          name: suraksha-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
